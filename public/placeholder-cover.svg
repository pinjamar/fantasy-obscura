<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 390">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="260" height="390" fill="url(#bg)"/>
  <!-- Spine -->
  <rect width="22" height="390" fill="url(#spine)"/>
  <line x1="22" y1="0" x2="22" y2="390" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <!-- Book icon: closed book stack -->
  <g transform="translate(80, 130)">
    <!-- Shadow book -->
    <rect x="6" y="6" width="90" height="120" rx="3" fill="#a78bfa" opacity="0.15"/>
    <!-- Book body -->
    <rect x="0" y="0" width="90" height="120" rx="3" fill="#7c3aed" opacity="0.18"/>
    <!-- Spine of icon -->
    <rect x="0" y="0" width="10" height="120" rx="3" fill="#6d28d9" opacity="0.2"/>
    <!-- Page lines -->
    <line x1="20" y1="28" x2="80" y2="28" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <line x1="20" y1="42" x2="80" y2="42" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <line x1="20" y1="56" x2="80" y2="56" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <line x1="20" y1="70" x2="80" y2="70" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <line x1="20" y1="84" x2="80" y2="84" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <!-- Star decoration -->
    <text x="45" y="112" font-family="serif" font-size="22" fill="#7c3aed" opacity="0.3" text-anchor="middle">✦</text>
  </g>
  <!-- Bottom label -->
  <text x="130" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7c3aed" opacity="0.55" text-anchor="middle" letter-spacing="1">FANTASY OBSCURA</text>
  <line x1="60" y1="326" x2="200" y2="326" stroke="#a78bfa" stroke-width="0.75" opacity="0.35"/>
  <text x="130" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#9d7aed" opacity="0.4" text-anchor="middle">no cover available</text>
</svg>
